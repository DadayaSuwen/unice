version: '3.8'

services:
  # PostgreSQL数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: unice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: housuwen
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - unice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unice"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unice_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:housuwen@postgres:5432/unice
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unice_network
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
    driver: local

networks:
  unice_network:
    driver: bridge